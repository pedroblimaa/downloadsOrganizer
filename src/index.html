<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/bar.css" />
    <link rel="icon" href="./assets/app-icon.png" />
    <title>Document</title>
</head>

<body>
    <div class="drag bar">
        <div class="no-drag bar-menu">
            <div id="min-btn" class="bar-icon">
                <div class="minimize"></div>
            </div>
            <div id="max-btn" class="bar-icon">
                <div class="maximize"></div>
            </div>
            <div id="close-btn" class="bar-icon">
                <div class="close">
                    <div class="close-left"></div>
                    <div class="close-right"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="container">
        <div class="language-container" data-language="pt-br" aria-label="Language selector">
            <button id="pt-br" class="active language-btn">PT</button>
            <button class="language-switch" aria-label="Toggle language" type="button">
                <span class="language-switch-knob"></span>
            </button>
            <button id="en-us" class="language-btn">EN</button>
        </div>

        <main class="content">
            <div class="intro">
                <h1 class="title">Downloads Organizer</h1>
            </div>

            <div class="trigger-action-container">
                <button id="organize-btn" class="btn primary-btn">Organize</button>
                <button id="undo-btn" class="btn secondary-btn">Undo</button>
            </div>
        </main>

        <div id="notification" class="notification" role="status" aria-live="polite">
            <div class="notification-icon"></div>
            <p id="notification-message" class="notification-message"></p>
        </div>
    </div>
    <script>
        require('./js/titleBar.js');
        require('./js/languageBtn.js')
        require('./js/script.js')
    </script>
</body>

</html>
